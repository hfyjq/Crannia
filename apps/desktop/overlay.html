<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!--
  接管期间的顶层横幅 —— 横幅文案是「操作接管-esc退出」。

  这个窗口的三条约束在 `main.cjs` 的 `setTakeoverOverlay` 里：
     `focusable:false`（不抢焦点）· `setContentProtection(true)`（不被截图拍到）·
     `alwaysOnTop("screen-saver")`（盖住普通置顶窗）。

  两层：贴顶全宽的**泛光条**（纯装饰，永远鼠标穿透）+ 居中的**浮窗**
  （鼠标移到上面时取消穿透，退出按钮可点）。

  Esc 不在这里处理 —— 这里收不到键盘（窗口不可聚焦，而且物理/注入的
     区分只有 Python 那边的 `WH_KEYBOARD_LL` 做得到）。这个页面只负责"看得见"
     和"点得动那个退出按钮"。
-->
<style>
  /* overflow:hidden 是双保险：窗口尺寸固定，任何溢出都只会变成难看的滚动条。 */
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden;
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-user-select: none; user-select: none; }
  body { display: block; }

  /* 贴顶全宽的泛光带：只负责"这一条屏幕被接管了"的存在感，不接收鼠标。 */
  .glowband { position: absolute; left: 0; right: 0; top: 0; height: 46px;
    pointer-events: none;
    /* ⚠️ 不用 `filter: blur()`：它在透明窗口里会建离屏合成层，背景丢了
       就是一条白带（真机现场）。径向渐变本身就柔和，不建合成层。 */
    background: radial-gradient(120% 100% at 50% 0%,
      rgba(224,177,90,.30) 0%,
      rgba(224,177,90,.12) 45%,
      rgba(224,177,90,.03) 70%,
      rgba(224,177,90,0) 100%);
    animation: bandGlow 2.8s ease-in-out infinite; }

  /* 居中浮窗 */
  .wrap { position: absolute; left: 0; right: 0; top: 7px; display: flex;
    justify-content: center; padding: 0 8px; }
  .bar { box-sizing: border-box; width: 360px; max-width: 100%; height: 38px;
    display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px;
    border-radius: 19px;
    background: linear-gradient(180deg, #33473d 0%, #24322b 100%);
    color: #f4f7f4; border: 1px solid rgba(236,196,122,.60);
    box-shadow: inset 0 0 14px rgba(224,177,90,.20),
                0 0 16px rgba(224,177,90,.40),
                0 4px 14px rgba(0,0,0,.35);
    animation: barGlow 2.8s ease-in-out infinite; }
  @keyframes bandGlow {
    0%, 100% { opacity: .62; }
    50% { opacity: 1; }
  }
  @keyframes barGlow {
    0%, 100% { border-color: rgba(236,196,122,.45);
      box-shadow: inset 0 0 12px rgba(224,177,90,.16),
                  0 0 12px rgba(224,177,90,.34),
                  0 4px 14px rgba(0,0,0,.35); }
    50% { border-color: rgba(236,196,122,.90);
      box-shadow: inset 0 0 18px rgba(224,177,90,.32),
                  0 0 24px rgba(224,177,90,.62),
                  0 4px 14px rgba(0,0,0,.35); }
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #e0b15a;
    box-shadow: 0 0 0 4px rgba(224,177,90,.18);
    animation: dotPulse 2.8s ease-in-out infinite; }
  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(224,177,90,.18); }
    50% { box-shadow: 0 0 0 6px rgba(224,177,90,.30),
                      0 0 12px rgba(224,177,90,.65); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar, .dot, .glowband { animation: none; }
  }
  .txt { flex: 1; font-size: 12px; letter-spacing: .04em; }
  button { height: 26px; border: 0; border-radius: 13px; padding: 0 12px;
    background: #e0b15a; color: #1f2a24; font-size: 11px; font-weight: 700;
    cursor: pointer; }
  button:hover { background: #ecc47a; }
</style>
</head>
<body>
  <div class="glowband" aria-hidden="true"></div>
  <div class="wrap">
    <div class="bar">
      <i class="dot"></i>
      <span class="txt" data-i18n>操作接管-esc退出</span>
      <button id="stop" data-i18n>退出</button>
    </div>
  </div>
  <script>
    //: 英文文案 —— 与 `splash.html` 同一条约定：键就是源码里那句中文，
    //: 这个页面不接 `/api/i18n`（它要先于后端就绪就要能画）。
    //: ⚠️ 漏一句的现场就是"浮窗上混着中英文"（真机抓到过一次）。
    const PAGE_LANG = new URLSearchParams(location.search).get("lang") || "";
    const SHOW_ZH = !PAGE_LANG || PAGE_LANG.startsWith("zh");
    const T_EN = {
      "操作接管-esc退出": "Takeover active — Esc to exit",
      "退出": "Exit",
    };
    (function applyLang() {
      if (SHOW_ZH) return;
      document.querySelectorAll("[data-i18n]").forEach((el) => {
        const key = (el.textContent || "").trim();
        if (T_EN[key]) el.textContent = T_EN[key];
      });
    })();

    document.getElementById("stop").addEventListener("click", () => {
      // 只暴露这一个具名动作（见 `overlay-preload.cjs`）。
      if (window.cranniaOverlay) window.cranniaOverlay.stop();
    });

    // 鼠标穿透：默认整窗穿透（透明区域不挡下面的点击）；鼠标进入浮窗时
    // 取消穿透让按钮可点，离开再恢复。`elementFromPoint` 比 `e.target`
    // 稳 —— 穿透模式下事件转发进来的 target 不一定是 DOM 命中的那个。
    (function () {
      const bar = document.querySelector(".bar");
      let ignored = true;
      function setIgnore(v) {
        if (v === ignored) return;
        ignored = v;
        try { if (window.cranniaOverlay) window.cranniaOverlay.setIgnore(v); } catch (_) { /* 壳不在就拉倒 */ }
      }
      window.addEventListener("mousemove", (e) => {
        const el = document.elementFromPoint(e.clientX, e.clientY);
        setIgnore(!(bar && el && bar.contains(el)));
      }, { passive: true });
      document.documentElement.addEventListener("mouseleave", () => setIgnore(true));
      window.addEventListener("blur", () => setIgnore(true));
    })();
  </script>
</body>
</html>
