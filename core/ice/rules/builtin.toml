# ICE 内置检测规则（第一版：只做结构化、只用校验位、零模型）
#
# 每条规则的字段：id / description / regex / secretGroup / keywords / filter，
# 外加本仓自己的两格：
#   supports_encryption  —— 闸：这条规则命中后允不允许替换。缺省 false（只报不改）。
#   validator            —— 校验器名。不认识的名字一律判 LOW（永不替换）。
#
# 规则顺序即优先级：重叠消解时排在前面的先占位。
#    身份证必须排在银行卡前面 —— 18 位身份证有约 1/10 的概率同时过 Luhn。
#
# 号段边界一律排除「它是某个数字字面量的一部分」。
#    判据是通用的：数字字面量由数字 + 小数点构成，所以
#      左：`(?<![0-9.])` —— 左边是数字或小数点，说明它前面还有数
#      右：`(?!\.?[0-9])` —— 右边是数字、或「小数点 + 数字」，说明它后面还接着数
#    左右不对称是有意的：前面的 `.` 只可能是小数点（"这是小数"）；
#      后面的 `.` 两种都可能是小数点或句号，所以只有"点后面还跟着数字"才算续接，
#      单独的 `.` 放行（英文句末的「卡号 4111….」是真卡号）。
#    出处是一次真实事故：只挡数字时，`0.0330999999999992` 的小数部分
#    恰好 16 位、Luhn 又碰巧通过，于是被替换掉，用户的数据被改坏。
#    打码那条判据逐字是「打码不能错（代价是用户数据被改坏）」。
#
# 本文件是安全承重件，随包发布（不放可写的 data/）：
#    它一旦被改坏，"只有高置信才替换"会降级成"乱替换"，而那一刻没有任何东西会红。

[[rules]]
id = "cn_id_card"
description = "中国大陆居民身份证号（18 位，ISO 7064 mod 11-2 校验位）"
# 6 位行政区 + 8 位出生日期 + 3 位顺序码 + 1 位校验码（可为 X）
# 前后 lookaround 保证不会从一个 19 位以上的数字串里切出 18 位
# 边界见文件头那段：`[0-9.]` / `\.?[0-9]`，不是 `[0-9]`。
regex = '(?<![0-9.])[1-9][0-9]{5}(?:18|19|20)[0-9]{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12][0-9]|3[01])[0-9]{3}[0-9Xx](?!\.?[0-9])'
secretGroup = 0
keywords = []
supports_encryption = true
validator = "cn_id_mod11_2"

[[rules]]
id = "cn_bank_card"
description = "银行卡号（16-19 位，Luhn 校验位）"
# 这一条就是那次事故的现场那条，见文件头。
#    `0.0330999999999992` 撞的就是它。修前当场量的：一本 16 万格（169,699）的表里
#    1,817 格被判成 PII，其中 11 格会被真的换掉（= 数据被改坏）。
#    两个数分开报是刻意的：`replaceable` 才是"改坏"，其余只是判定。
# 已知残余（没验过，别当已修）：科学计数法 `1234567890123456e5`
#    右边是字母 `e`，这条边界挡不住。要挡得往字符类里加 `eE`，
#    而那会开始吃掉正常文本里相邻的符号，所以先记下、不先修。
regex = '(?<![0-9.])[0-9]{16,19}(?!\.?[0-9])'
secretGroup = 0
keywords = []
supports_encryption = true
validator = "luhn"

[[rules]]
id = "cn_mobile"
description = "中国大陆手机号（1[3-9] 开头 + 号段表）"
# 边界同文件头那段。这一条 `supports_encryption = false`（只报不改），
#   所以它错了不会改坏数据；加边界是为了少一行噪声。
regex = '(?<![0-9.])1[3-9][0-9]{9}(?!\.?[0-9])'
secretGroup = 0
keywords = []
# supports_encryption = false 是有意的，不是漏了。
# 手机号与另两条并列时容易以为"每条都带校验位"，但那句话只对另两条成立：
# 身份证有 ISO 7064、银行卡有 Luhn，而手机号没有校验位，只有一张号段表。
# 号段表不是证明，只是"看起来像"。误检务必不能改坏数据，只有高置信才替换，
# 所以第一版让手机号只报不改：多一个读数，零风险。
# 要把它打开：把这一行改成 true（一行的事），但先想清楚误报的代价。
supports_encryption = false
validator = "cn_mobile"
