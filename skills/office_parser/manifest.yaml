  # ==================================================================
  # v0.5.0: Full Word manipulation suite (ported from Office-Word-MCP-Server)
  # ==================================================================

  # -- Document management --

  - name: get_document_info
    permission: read
    destructive: false
    output_kind: structured
    description: >
      获取 Word 文档的元数据：标题、作者、段落数、表格数、文件大小。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: ".docx 文件路径"
      required: ["file_path"]

  - name: get_document_text
    permission: read
    destructive: false
    output_kind: prose
    description: >
      提取 Word 文档的全部文本内容（按段落分行）。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
      required: ["file_path"]

  - name: get_document_outline
    permission: read
    destructive: false
    output_kind: structured
    description: >
      提取 Word 文档的大纲结构（所有标题的级别、文本、段落索引）。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
      required: ["file_path"]

  - name: list_available_documents
    permission: read
    destructive: false
    output_kind: structured
    description: >
      列出指定目录中的所有 .docx 文件及其大小。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        directory:
          type: string
          default: "."
          description: "搜索目录（默认 workspace）"

  - name: copy_document
    permission: write
    destructive: false
    description: >
      创建 Word 文档的副本。
      ★ 目标文件**已存在**时必须先读过它（`get_document_text`）—— 副本是**整本覆盖**，盖掉一份你没读过的文件会被拒。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        source_file:
          type: string
          description: "源文档路径"
        destination_file:
          type: string
          description: "目标路径（可选，默认自动生成）"
      required: ["source_file"]

  - name: merge_documents
    permission: write
    destructive: false
    description: >
      将多个 Word 文档合并为一个文档。可选择在文档间插入分页符。自动复制表格。
      ★ 目标文件**已存在**时必须先读过它（`get_document_text`）—— 本工具是**整本覆盖**，盖掉一份你没读过的文件会被拒。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        target_file:
          type: string
          description: "输出文件名"
        source_files:
          type: array
          items: {type: string}
          description: "要合并的源文件列表"
        add_page_breaks:
          type: boolean
          default: true
          description: "是否在文档间插入分页符"
      required: ["target_file", "source_files"]

  # -- Enhanced content creation --

  - name: add_word_heading
    permission: write
    destructive: false
    description: >
      向 Word 文档添加带格式的标题。支持字体/大小/加粗/斜体/底部边框。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
        text:
          type: string
          description: "标题文本"
        level:
          type: integer
          default: 1
          description: "标题级别 (1-9)"
        font_name:
          type: string
          description: "字体（如 黑体）"
        font_size:
          type: integer
          description: "字体大小（磅）"
        bold:
          type: boolean
        italic:
          type: boolean
        border_bottom:
          type: boolean
          default: false
          description: "是否添加底部边框（分区标题）"
      required: ["file_path", "text"]

  - name: add_word_paragraph
    permission: write
    destructive: false
    description: >
      向 Word 文档添加带格式的段落。支持字体/大小/加粗/斜体/颜色/样式。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
        text:
          type: string
        style:
          type: string
          description: "可选的段落样式名"
        font_name:
          type: string
        font_size:
          type: integer
        bold:
          type: boolean
        italic:
          type: boolean
        color:
          type: string
          description: "字体颜色，hex 如 'FF0000' 或颜色名如 'red'"
      required: ["file_path", "text"]

  - name: apply_table_of_contents
    permission: write
    destructive: false
    output_kind: structured
    description: >
      插入**目录** / **图目录** / **表目录** —— 写的是**真域**（`TOC`），
      Word/WPS 打开时可以更新，不是一张死清单。
      ★ `kind`：`toc`=正文目录（按标题样式收，`max_level` 管显示级别）/
      `figure`=**图目录** / `table`=**表目录**（后两个按**题注标签**收）。
      ★ 放在哪儿：给 `replace_text` 就**就地替换**那段占位文字
      （如「请在此插入目录」）；给 `paragraph_index` 就插在**那一段之后**；
      都不给就插在正文最前。
      ★★ **图目录 / 表目录的前提是那些图标题已经是题注** ——
      手写的 `图1 系统架构` 收不进来，得先用 `replace_manual_captions` 换掉编号。
      ★ 域要有内容得让引擎算一次：Word/WPS 打开时会提示更新（我们开了
      `updateFields`），LibreOffice 自己重算；在那之前那处显示占位符。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
