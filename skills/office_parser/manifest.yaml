kind: skill
name: office_parser
version: "0.5.0"
draft: false
load_strategy: on_demand
#: 技能级分类器声明：这一族的工具只写得到工作区（`SecurityGuard` 挡着），
#: 而第 ② 层（工作区内的写）在运行期已经把它们放行了。逐个抄 70 遍 `none`
#: 不是做过 70 个决定，是把同一个决定抄 70 遍。所以：技能级默认 + 工具级覆盖
#: （见下面的 delete_files）。
review_input: none
description: "Full Office suite — Word/PowerPoint/Excel parsing, creation, formatting, charts, pivot tables, Excel tables, sheet management, PDF conversion, and AI-driven SVG-to-DrawingML PPT generation."

tools:
  - name: parse_docx
    permission: read
    destructive: false
    output_kind: prose
    description: >
      Stream-parse a Word (.docx) file paragraph by paragraph, extract tables,
      and chunk the content. Returns metadata only — use search_chunks to
      query specific content or summarize_document for a full summary.
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: "Path to the .docx file. If relative, resolved under workspace/"
      required: ["file_path"]

  - name: parse_pptx
    permission: read
    destructive: false
    output_kind: prose
    description: >
      Extract text from a PowerPoint (.pptx) file slide by slide.
      Each slide is treated as one page. Text from all shapes (titles,
      text boxes, tables) is collected and chunked.
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: "Path to the .pptx file. If relative, resolved under workspace/"
      required: ["file_path"]

  - name: parse_xlsx
    permission: read
    destructive: false
    output_kind: prose
    description: >
      Stream-read an Excel spreadsheet (.xlsx or .xls).
      .xlsx uses openpyxl read_only mode; .xls (Excel 97–2003) uses xlrd.
      Rows are read one at a time, accumulated into pages (100 rows each), and chunked.
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: "Path to the .xlsx or .xls file. If relative, resolved under workspace/"
        sheet_name:
          type: string
          description: "Optional: specific sheet name to read. Defaults to the active sheet."
      required: ["file_path"]

  # ==================================================================
  # v0.8.5: Document structure extraction
  # ==================================================================

  - name: extract_document_structure
    permission: read
    destructive: false
    description: >
      Extract document outline/structure from Word (.docx) or PowerPoint
      (.pptx) files without full text parsing. For Word: returns heading
      hierarchy with levels, text, and paragraph positions. For PowerPoint:
      returns slide numbers, layout types, and titles.
      Use to quickly understand document organization before deciding
      whether to do a full parse.
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: "Path to the .docx or .pptx file. If relative, resolved under workspace/"
      required: ["file_path"]

  # ==================================================================
  # v0.2.0: Write operations
  # ==================================================================

  - name: create_document
    permission: write
    destructive: false
    description: >
      创建 Word 文档 / PPT 会话 / 纯文本。

      Word 与 TXT【推荐】：整篇正文放进 `content`，再给 `output_name` ——
      「创建→写入→导出」= 1 次调用。content 支持轻量 Markdown：
      `#`/`##`/`###` 标题(1-3 级) · `-`/`*`/`1.` 列表 · 空行分段。
      用户说"输出到 txt / 存成 txt / 要文字版"时用 doc_type="txt"。

      ⚠️ 不要"一个段落调一次 add_block" —— 每多一次调用就多一次完整 LLM
      往返，写一次摘要会因此膨胀到 ~40 次调用 / 23 万 tokens。
      add_block 只用于图片这类结构化块（它有 20 块上限）。

      PPT：建会话后用 add_slide 逐步构建，export_document 渲染。
      Excel：直接用 write_excel_data（无需 session）。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        doc_type:
          type: string
          enum: ["word", "ppt", "ppt_svg", "txt"]
          description: "txt=纯文本，content 原样写入、不做 Markdown 解析"
        title:
          type: string
          description: "可选标题"
        content:
          type: string
          description: >
            【推荐】整篇正文，一次写完。
            **支持的 Markdown 子集**：`#`/`##`/`###` 标题 · `- ` 或 `1. ` 列表 ·
            空行分段 · `**加粗**` · **管道表格**（`| a | b |` 后接一行
            `| --- | --- |` 分隔 ⇒ 建成真表格）。
            · **指标卡** `:::kpi`…`:::`：行内 `标签 | 数值 | 增减`（后两列可省）——
              **3-4 个**核心数字用卡片，再多就用表格。
            · **提示框**：注意事项 `> [!NOTE]`、风险警告 `[!WARNING]`、禁止/危险 `[!CAUTION]`；
              光 `>` 是引用块。
            · **分隔线** `---`（单独一行，用在**章节之间**）。
            ⚠️ 图片仍不在里面 —— 走 `add_block(block_type="image", image_path=...)`。
        output_name:
          type: string
          description: "给了它就在同一次调用里导出成最终文件名（省掉 export_document）"
        source_file:
          type: string
          description: >
            ★★ **长报告走这条**：内容**引用一个文件**（`.md` / `.txt`），
            不必把正文塞进这次调用。先把内容分几次 `write_file` / `edit_file`
            写进一个文件，再 `create_document(source_file="报告.md")` 一次成形。
            ⚠️ 正文**很长时优先用它** —— 一次调用塞不下的长内容会被上游截断，
            那会掉进「参数为空」那条路（工具会拒并告诉你怎么改，但白跑一趟）。
            `content` 与它同时给 ⇒ **`content` 优先**。
      required: ["doc_type"]

  - name: add_block
    permission: write
    destructive: false
    description: >
      向 Word 文档追加**一个**内容块，立即写盘（块类型见 block_type 枚举）。

      ⚠️ 只用于表格 / 图片这类**结构化块** —— 纯文字的整篇内容走
      create_document(content=)，一次写完。

      ⚠️ 硬上限 20 块，超过直接失败。session_id 必须是 create_document
      返回的那个 .docx 路径，不要自己拼。
      ★★ **报告很长（>20 块）时别用它** —— 走
      `create_document(source_file=…)`：先把正文写成文件，一次成形。
      逐块加出来的长文档**会丢掉标题层级**（到上限就只能压成大段落）。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        session_id:
          type: string
          description: "From create_document()"
        block_type:
          type: string
          enum: ["heading", "paragraph", "table", "list", "image", "page_break"]
        content:
          type: string
          description: "Text content (for heading/paragraph/list)"
        level:
          type: integer
          description: "Heading level 1-3 (for heading block_type)"
        rows:
          type: array
          items:
            type: array
            items: {type: string}
          description: "List of row lists for table block_type"
        image_path:
          type: string
          description: "Path to image file (relative to workspaces)"
        ordered:
          type: boolean
          description: "True for ordered/numbered list"
      required: ["session_id", "block_type"]

  - name: add_slide
    permission: write
    destructive: false
    description: >
      Append a slide to a PowerPoint presentation under construction.
      Slide types: title (title+subtitle), content (title+bullets),
      image (title+picture), table (title+data rows).
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
      【中文】往一个正在制作的 PPT 里加一页（简版路线，4 种版式）。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        session_id:
          type: string
          description: "From create_document(doc_type='ppt')"
        slide_type:
          type: string
          enum: ["title", "content", "image", "table"]
        title:
          type: string
          description: "Slide title"
        bullets:
          type: array
          items: {type: string}
          description: "Bullet points (for content slide)"
        image_path:
          type: string
          description: "Image path (for image slide)"
        rows:
          type: array
          items:
            type: array
            items: {type: string}
          description: "Row data (for table slide)"
      required: ["session_id", "slide_type"]

  - name: export_document
    permission: write
    destructive: false
    description: >
      Word: 重命名工作文件为最终文件名（add_block 已实时写盘，无需渲染）。
      ★ 目标文件**已存在**时必须先读过它（`get_document_text`）—— 这一步是**整本覆盖**，盖掉一份你没读过的文件会被拒。
      PPT/PPT_SVG: 从累积的幻灯片渲染为 .pptx 文件并保存到磁盘。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
      ★ **生成完还能继续改**：背景 / 裁剪 / 音频 / 母版样式 / 隐藏母版图形交给**幻灯片美化**那五件（`set_ppt_background` · `set_ppt_background_graphics` · `crop_ppt_picture` · `add_ppt_audio` · `set_ppt_master_text_style`）—— 那些是 SVG 表达不了的东西。
      【中文】把会话里的内容**渲染成最终文件**（Word 是重命名，PPT 是从累积的幻灯片导出 .pptx）。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        session_id:
          type: string
          description: "Word: 文件路径。PPT: create_document() 返回的 session_id"
        output_name:
          type: string
          description: "输出文件名 (e.g. 'report.docx', 'slides.pptx')"
      required: ["session_id"]

  # ==================================================================
  # v0.5.0: Full Excel manipulation suite (ported from excel-mcp-server)
  # ==================================================================

  - name: get_workbook_metadata
    permission: read
    destructive: false
    output_kind: structured
    description: >
      获取 Excel 工作簿的元数据：工作表列表、数量、文件大小。
      可选 include_ranges=true 获取每个工作表的已使用范围。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: ".xlsx 文件路径"
        include_ranges:
          type: boolean
          default: false
          description: "是否包含每个工作表的已使用范围"
      required: ["file_path"]

  - name: read_excel_data
    permission: read
    destructive: false
    output_kind: prose
    description: >
      读取 Excel 单元格区域。三种读法：(1) 看一小块 —— 默认，逐格回地址/值/行列号；
      (2) 大表翻页 —— compact=true 配 max_rows/offset，回二维数组，走流式；
      (3) ★ 同一块区域 × 全簿 —— sheet_name="*"，一次把每张表的同一区域都读回来，
      回 blocks 每表一段。这是"逐月对比 / 跨表汇总"的正确读法（别一张张表调 9 次）。
      公式默认回**缓存值**（不是公式串），所以累计/环比这类算出来的数能直接看到。
      合并单元格里的分组标签默认只出现在左上角那一格，merge_mode="fill" 可把它铺满。
      ★★ **做汇总时**：表里若已有 `累计` / `合计` / `小计` / `年计划`
      这类列，**优先用它的数**（那是这张表的权威口径）；**若你自己算了，
      必须跟表里那个数对一次账，对不上要告诉用户** —— 对不上通常意味着
      表里有调整，而那正是用户最需要知道的。
      ⚠️ 你只读了某个范围时，回执会告诉你**范围之外还有什么**
      （只读 A5:H12 会漏掉 累计完成 / 年计划 / 完成进度 / 上年度累计 那几列）——
      **看到它就先去看那边，别急着自己加**。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: ".xlsx / .xls 文件路径"
        sheet_name:
          type: string
          description: >
            工作表名；**"*" = 全部工作表**（跨表读）；省略 = 第一张表。
            用于"1-9月对比"这类：给 "*" 配 columns 一次拿全。
        start_cell:
          type: string
          default: "A1"
        end_cell:
          type: string
          description: >
            结束单元格。不提供则自动向下扩展（有行数安全上限，撞到会在 notes 里说）。
            ★ 跨表读时**给出它**很重要，否则每张表都按同一块区域读，容易顶穿预算。
        columns:
          type: array
          items: {type: string}
          description: >
            只保留这几列（**列字母**，如 ["B","E","F"]）。跨表读时几乎必需 ——
            9 张表 × 全宽很容易超出单次上限。用字母不用列名：表里的名字常带空格
            或前后不一致（"花  鲢" / "黄桑鱼" vs "黄颡鱼"），只有位置可靠。
        compact:
          type: boolean
          default: false
          description: "true = 回二维数组，**首列是表内行号**（其余才是值），省一半以上字符；大表分页时配 max_rows/offset 用"
        offset:
          type: integer
          default: 0
          description: "从区域第几行开始（配合 compact 翻页）"
        max_rows:
          type: integer
          description: "最多回几行（配合 compact 翻页）"
        merge_mode:
          type: string
          enum: ["raw", "fill"]
          default: "raw"
          description: >
            "raw" = 原样（合并区非左上角是空）；"fill" = 把分组标签铺到成员格并标
            merged_from。纵向合并的报表（分组小计那种）要用 "fill"，否则看不出
            后面几行属于哪个组。
        formula_mode:
          type: string
          enum: ["auto", "cached", "formula"]
          default: "auto"
          description: >
            "auto"（默认）= 有缓存值给值、没有给公式串，并标出哪些格是公式；
            "cached" = 只要值；"formula" = 只要公式串（一般不需要）。
            默认给**值**是有意的：跨表累计/环比全靠公式，给公式串就读不到数。
        include_validation:
          type: boolean
          default: false
          description: "附带每格的数据验证规则（下拉列表等）；会关掉流式快路"
      required: ["file_path"]

  - name: write_excel_data
    permission: write
    destructive: false
    description: >
      直接向 Excel 工作表写入数据（无需 session）。文件不存在时会自动创建。
      ★ 文件**已存在**时必须先读过它（`read_excel_data`）—— 写的是**模型给的那块数据**，盖掉一份你没读过的表会被拒。
      data 为二维列表，每行是一个列表。
      ★ 以 `=` 开头的值**默认按文本写**（它们不会变成公式）。要写真公式：用 `apply_formula`，或传 `allow_formula=true`。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: ".xlsx 文件路径"
        sheet_name:
          type: string
          description: "目标工作表名称"
        data:
          type: array
          items:
            type: array
            items: {}
          description: "要写入的数据，每行为一个列表"
        start_cell:
          type: string
          default: "A1"
        allow_formula:
          type: boolean
          default: false
          description: >
            `=` 开头的值按什么写。false（默认）= 按**字面文本**写；
            true = 当公式写，并过公式禁形检查（DDE / 外部工作簿引用会被拒）。
      required: ["file_path", "sheet_name", "data"]

  - name: apply_formula
    permission: write
    destructive: false
    description: >
      向单元格应用 Excel 公式（如 SUM/AVERAGE/VLOOKUP/IF 等）。
      先验证公式语法再写入。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: ".xlsx 文件路径"
        sheet_name:
          type: string
        cell:
          type: string
          description: "目标单元格，如 'D5'"
        formula:
          type: string
          description: "Excel 公式，如 '=SUM(A1:A10)'"
      required: ["file_path", "sheet_name", "cell", "formula"]

  - name: validate_formula_syntax
    permission: write
    destructive: false
    description: >
      验证 Excel 公式语法（括号匹配、单元格引用合法性），不实际写入。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: ".xlsx 文件路径"
        sheet_name:
          type: string
        cell:
          type: string
        formula:
          type: string
      required: ["file_path", "sheet_name", "cell", "formula"]

  - name: format_excel_range
    permission: write
    destructive: false
    description: >
      对单元格区域应用格式：字体（加粗/斜体/下划线/大小/颜色）、
      背景色、边框（样式/颜色）、数字格式、对齐方式、自动换行、
      合并单元格、条件格式（色阶/数据条/图标集/公式规则）。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
          description: ".xlsx 文件路径"
        sheet_name:
          type: string
        start_cell:
          type: string
          description: "起始单元格，如 'A1'"
        end_cell:
          type: string
          description: "结束单元格（可选，不提供则只格式化起始格）"
        bold:
          type: boolean
          default: false
        italic:
          type: boolean
          default: false
        underline:
          type: boolean
          default: false
        font_size:
          type: integer
          description: "字体大小（磅）"
        font_color:
          type: string
          description: "字体颜色，6位hex如 'FF0000'"
        bg_color:
          type: string
          description: "背景色，6位hex如 'FFFF00'"
        border_style:
          type: string
          enum: ["thin", "medium", "thick", "double", "dashed", "dotted"]
        border_color:
          type: string
          description: "边框颜色，6位hex"
        number_format:
          type: string
          description: "数字格式，如 '#,##0.00' 或 'YYYY-MM-DD'"
        alignment:
          type: string
          enum: ["left", "center", "right", "justify"]
        wrap_text:
          type: boolean
          default: false
        merge_cells:
          type: boolean
          default: false
          description: "是否合并该区域"
        conditional_format:
          type: object
          description: >
            条件格式规则，例如 {"type":"color_scale","params":{...}}
            支持: color_scale, data_bar, icon_set, formula, cell_is
        column_width:
          type: number
          description: "列宽（Excel 的字符数单位）。区域跨 B:D 就给这三列都设一遍。"
        row_height:
          type: number
          description: "行高（磅）。区域里的每一行都设一遍。"
        auto_width:
          type: boolean
          default: false
          description: >
            按每列**最长的内容**自动估列宽（中文按两倍宽算）。表格内容宽窄不一时用这个，
            比手填 column_width 省事；两者都给时以 column_width 为准。
      required: ["file_path", "sheet_name", "start_cell"]

  - name: create_excel_chart
    permission: write
    destructive: false
    description: >
      在工作表中创建图表，锚定到指定单元格。**data_range 的首列当类别轴**，
      其余每列一条序列。类型：line(折线) bar(柱状) pie(饼图) scatter(散点)
      area(面积) doughnut(圆环) radar(雷达) bubble(气泡) surface(曲面)
      stock(**股价图**，要 4 列：开/高/低/收) projectedpie(复合饼图)。
      ★ **组合图**：主图给 chart_type + data_range，其余每条腿放 combo 里
      （每条腿自带 chart_type 与 data_range）—— 「柱形 + 折线同图」就用它。
      ★ 子类型用 grouping（clustered/stacked/percentStacked，柱/线/面积）；
      bar_dir 区分柱('col')与条('bar')；marker=true 给折线加数据标记。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
        sheet_name:
          type: string
        data_range:
          type: string
          description: "数据范围，如 'A1:B10'（首列是类别）"
        chart_type:
          type: string
          enum: ["line", "bar", "pie", "scatter", "area", "doughnut",
                 "radar", "bubble", "surface", "stock", "projectedpie"]
        target_cell:
          type: string
          description: "图表左上角锚定单元格，如 'D1'"
        title:
          type: string
          description: "图表标题"
        x_axis:
          type: string
          description: "X轴标签"
        y_axis:
          type: string
          description: "Y轴标签"
        show_data_labels:
          type: boolean
          default: true
          description: "是否显示数据标签"
        show_legend:
          type: boolean
          default: true
          description: "是否显示图例"
        grouping:
          type: string
          enum: ["clustered", "standard", "stacked", "percentStacked"]
          description: "分组方式（柱/线/面积）：堆积折线图 = stacked"
        bar_dir:
          type: string
          enum: ["col", "bar"]
          description: "柱状图的方向：col 是柱，bar 是条"
        marker:
          type: boolean
          default: false
          description: "折线/散点是否每条序列都带数据标记"
        style:
          type: integer
          description: "图表预设样式 1~48（0 = 默认）"
        legend_position:
          type: string
          enum: ["r", "l", "t", "b", "tr"]
          description: "图例位置：t 是顶部"
        gridlines:
          type: boolean
          default: true
          description: "是否保留主要网格线（false = 删掉）"
        combo:
          type: array
          description: "组合图的其余各条腿"
          items:
            type: object
            properties:
              chart_type: {type: string}
              data_range: {type: string}
              grouping: {type: string}
              bar_dir: {type: string}
              marker: {type: boolean}
              y_axis: {type: string}
            required: ["chart_type", "data_range"]
      required: ["file_path", "sheet_name", "data_range", "chart_type", "target_cell"]

  - name: create_excel_pivot
    permission: write
    destructive: false
    description: >
      创建透视汇总表（新工作表）。按 rows 字段分组，对 values 字段
      执行聚合（sum/average/count/min/max）。
      ★ 产出里若含算出来的数：交回前**逐条回到来源**核一遍；表里已有
      合计/累计/年计划 就照用它的原值，别自己加算一堆。核不下来先说出来，别交。
    inputSchema:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      type: object
      properties:
        file_path:
          type: string
        sheet_name:
          type: string
          description: "源数据工作表"
        data_range:
          type: string
          description: "源数据范围，如 'A1:D100'"
        rows:
          type: array
          items: {type: string}
